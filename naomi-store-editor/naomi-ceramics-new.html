ing: 0.12em;\n    font-family: var(--sans);\n  }\n\n  nav { display: flex; gap: 32px; align-items: center; }\n  nav a {\n    font-size: 0.9rem;\n    color: var(--text-soft);\n    font-weight: 400;\n    transition: color 0.2s;\n    letter-spacing: 0.02em;\n  }\n  nav a:hover { color: var(--clay); }\n\n  .nav-wa {\n    background: var(--wa-green);\n    color: white !important;\n    padding: 9px 20px;\n    border-radius: 30px;\n    font-weight: 500;\n    font-size: 0.85rem;\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    transition: transform 0.2s, box-shadow 0.2s;\n  }\n  .nav-wa:hover {\n    transform: translateY(-1px);\n    box-shadow: 0 4px 16px rgba(37,211,102,0.35);\n  }\n\n  /* ── LANGUAGE TOGGLE ── */\n  .lang-toggle {\n    background: transparent;\n    border: 1.5px solid var(--border);\n    color: var(--text-soft);\n    font-family: var(--sans);\n    font-size: 0.78rem;\n    font-weight: 500;\n    letter-spacing: 0.1em;\n    padding: 6px 14px;\n    border-radius: 20px;\n    cursor: pointer;\n    transition: all 0.2s;\n    margin-right: 12px;\n  }\n  .lang-toggle:hover {\n    border-color: var(--clay);\n    color: var(--clay);\n  }\n  .lang-toggle.active-en {\n    background: var(--clay);\n    color: white;\n    border-color: var(--clay);\n  }\n\n  /* ─── HERO ─── */\n  .hero {\n    min-height: 92vh;\n    position: relative;\n    overflow: hidden;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n  }\n\n  /* Background video */\n  .hero-video-bg {\n    position: absolute;\n    inset: 0;\n    width: 100%;\n    height: 100%;\n    object-fit: cover;\n    z-index: 0;\n  }\n\n  /* Warm dark overlay — lets video breathe but keeps text fully readable */\n  .hero-overlay {\n    position: absolute;\n    inset: 0;\n    background:\n      linear-gradient(\n        to bottom,\n        rgba(30, 22, 12, 0.52) 0%,\n        rgba(30, 22, 12, 0.68) 55%,\n        rgba(30, 22, 12, 0.80) 100%\n      );\n    z-index: 1;\n  }\n\n  .hero-content {\n    position: relative;\n    z-index: 2;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    text-align: center;\n    padding: 80px 40px;\n    max-width: 780px;\n    width: 100%;\n  }\n\n  .hero-label {\n    font-size: 0.75rem;\n    letter-spacing: 0.25em;\n    color: var(--gold);\n    text-transform: uppercase;\n    margin-bottom: 28px;\n    font-family: var(--sans);\n    font-weight: 300;\n  }\n\n  .hero-title {\n    font-family: var(--serif);\n    font-size: clamp(2.8rem, 6vw, 5rem);\n    font-weight: 300;\n    color: var(--gold-light);\n    line-height: 1.2;\n    margin-bottom: 16px;\n    text-shadow: 0 2px 20px rgba(0,0,0,0.5);\n  }\n\n  .hero-title strong {\n    font-weight: 600;\n    color: #fff;\n    text-shadow: 0 2px 24px rgba(0,0,0,0.6);\n  }\n\n  .hero-subtitle {\n    font-family: var(--serif);\n    font-size: 1.15rem;\n    color: rgba(232, 213, 168, 0.88);\n    font-weight: 300;\n    margin-bottom: 48px;\n    line-height: 1.85;\n    max-width: 520px;\n    text-shadow: 0 1px 12px rgba(0,0,0,0.55);\n  }\n\n  .hero-ctas { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }\n\n  .btn-primary {\n    background: var(--gold);\n    color: var(--earth);\n    padding: 14px 32px;\n    border-radius: var(--radius);\n    font-weight: 500;\n    font-size: 0.95rem;\n    transition: all 0.25s;\n    border: none;\n    cursor: pointer;\n    font-family: var(--sans);\n    letter-spacing: 0.02em;\n  }\n  .btn-primary:hover {\n    background: var(--gold-light);\n    transform: translateY(-2px);\n    box-shadow: var(--shadow);\n  }\n\n  .btn-outline {\n    border: 1px solid rgba(201,169,110,0.5);\n    color: var(--gold-light);\n    padding: 14px 32px;\n    border-radius: var(--radius);\n    font-size: 0.95rem;\n    transition: all 0.25s;\n    background: transparent;\n    cursor: pointer;\n    font-family: var(--sans);\n  }\n  .btn-outline:hover {\n    border-color: var(--gold);\n    background: rgba(201,169,110,0.1);\n m;\n  }\n  .reveal-visible {\n    opacity: 1;\n    transform: translateY(0);\n  }\n  /* Stagger delays for sibling elements */\n  .reveal-delay-1 { transition-delay: 80ms; }\n  .reveal-delay-2 { transition-delay: 160ms; }\n  .reveal-delay-3 { transition-delay: 240ms; }\n  .reveal-delay-4 { transition-delay: 320ms; }\n  .reveal-delay-5 { transition-delay: 400ms; }\n  /* === END ENHANCEMENT 1 === */\n\n  /* === ENHANCEMENT 2: ORGANIC SVG SECTION DIVIDERS === */\n  .wave-divider {\n    display: block;\n    width: 100%;\n    height: 80px;\n    position: relative;\n    z-index: 2;\n    line-height: 0;\n    overflow: hidden;\n  }\n  .wave-divider svg {\n    display: block;\n    width: 100%;\n    height: 100%;\n  }\n  .wave-divider--tall { height: 100px; }\n  .wave-divider--short { height: 65px; }\n  .wave-divider--flip svg { transform: scaleX(-1); }\n  @media (max-width: 900px) {\n    .wave-divider { height: 50px; }\n    .wave-divider--tall { height: 65px; }\n    .wave-divider--short { height: 40px; }\n  }\n  /* Soften borders on sections adjacent to wave dividers */\n  .trust-strip { border-bottom: none; }\n  .category-nav { border-bottom: none; }\n  .about-section { border-top: none; }\n  .reviews-form-section { border-bottom: none; }\n  .testimonials-section + .wave-divider + .b2b-section { border-top: none; }\n  /* === END ENHANCEMENT 2 === */\n\n  /* === ENHANCEMENT 3: BACKGROUND DEPTH & TEXTURE === */\n\n  /* — Hero: off-center radial warmth + noise texture — */\n  .hero-content::before {\n    content: '';\n    position: absolute;\n    inset: 0;\n    background:\n      radial-gradient(ellipse 80% 90% at 30% 70%, rgba(140,90,40,0.18) 0%, transparent 70%),\n      radial-gradient(ellipse 60% 50% at 80% 20%, rgba(92,74,50,0.12) 0%, transparent 60%);\n    z-index: 0;\n    pointer-events: none;\n  }\n  /* Noise grain specific to hero content */\n  .hero-content > * { position: relative; z-index: 1; }\n  .hero-content .hero-noise-layer {\n    position: absolute;\n    inset: 0;\n    background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E\");\n    background-size: 200px 200px;\n    opacity: 0.5;\n    pointer-events: none;\n    z-index: 0;\n  }\n\n  /* — Products section: subtle workshop grid texture — */\n  .products-section {\n    position: relative;\n  }\n  .products-section::before {\n    content: '';\n    position: absolute;\n    inset: 0;\n    background-image:\n      repeating-linear-gradient(\n        0deg,\n        rgba(92,74,50,0.03) 0px,\n        rgba(92,74,50,0.03) 1px,\n        transparent 1px,\n        transparent 60px\n      ),\n      repeating-linear-gradient(\n        90deg,\n        rgba(92,74,50,0.02) 0px,\n        rgba(92,74,50,0.02) 1px,\n        transparent 1px,\n        transparent 60px\n      );\n    pointer-events: none;\n    z-index: 0;\n  }\n  .products-section > * { position: relative; z-index: 1; }\n\n  /* — CTA section: deep moody earth with amber glow — */\n  .cta-section {\n    background:\n      radial-gradient(ellipse 70% 60% at 50% 50%, rgba(160,120,60,0.15) 0%, transparent 70%),\n      radial-gradient(ellipse 50% 80% at 50% 100%, rgba(92,74,50,0.10) 0%, transparent 60%),\n      var(--cream);\n    position: relative;\n  }\n  .cta-section::before {\n    content: '';\n    position: absolute;\n    inset: 0;\n    background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)' opacity='0.035'/%3E%3C/svg%3E\");\n    background-size: 180px 180px;\n    opacity: 0.6;\n    pointer-events: none;\n    z-index: 0;\n  }\n  .ct ('rf-photo-name').textContent = e.target.files[0]?.name || '';\n});\n\n// Submit\ndocument.getElementById('rf-submit').addEventListener('click', async () => {\n  const name = document.getElementById('rf-name').value.trim();\n  const text = document.getElementById('rf-text').value.trim();\n  const product = document.getElementById('rf-product').value;\n  const t = TRANSLATIONS[currentLang];\n  if (!name || text.length < 20) {\n    alert(t.reviewFormValidation);\n    return;\n  }\n  const btn = document.getElementById('rf-submit');\n  btn.disabled = true;\n  btn.textContent = t.reviewFormSending;\n\n  let image_url = null;\n  const photoFile = document.getElementById('rf-photo').files[0];\n  if (photoFile) {\n    const ext = photoFile.name.split('.').pop();\n    const filename = `${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;\n    const { data: uploadData, error: uploadErr } = await db.storage\n      .from('review-photos')\n      .upload(filename, photoFile, { cacheControl: '3600', upsert: false });\n    if (!uploadErr) {\n      const { data: urlData } = db.storage.from('review-photos').getPublicUrl(filename);\n      image_url = urlData.publicUrl;\n    }\n  }\n\n  const { error } = await db.from('reviews').insert({\n    name, text, product, rating: selectedRating, image_url, approved: false\n  });\n\n  if (error) {\n    alert(t.reviewFormError);\n    btn.disabled = false;\n    btn.textContent = t.reviewFormSubmit;\n  } else {\n    document.getElementById('rf-success').style.display = 'block';\n    btn.style.display = 'none';\n    document.getElementById('rf-name').value = '';\n    document.getElementById('rf-text').value = '';\n    // Send email notification to Naomi (don't block UI on failure)\n    db.functions.invoke('send-review-email', {\n      body: { name, product, rating: selectedRating, text, image_url }\n    }).catch(() => {});\n  }\n});\n\n// Load & display approved reviews (replaces static testimonials)\nasync function loadReviews() {\n  const { data } = await db.from('reviews').select('*').eq('approved', true).order('created_at', { ascending: false });\n  if (!data || data.length === 0) return;\n  const grid = document.querySelector('.testimonials-grid');\n  if (!grid) return;\n  grid.innerHTML = data.map(r => `\n    <div class=\"testimonial-card\">\n      <div class=\"testimonial-stars\">${'★'.repeat(r.rating)}${'☆'.repeat(5 - r.rating)}</div>\n      ${r.image_url ? `<img src=\"${r.image_url}\" alt=\"תמונת לקוח\" style=\"width:100%;border-radius:4px;margin-bottom:12px;object-fit:cover;max-height:200px\">` : ''}\n      <p class=\"testimonial-text\">${r.text}</p>\n      ${r.product ? `<p class=\"testimonial-product\">${TRANSLATIONS[currentLang].reviewBought} ${r.product}</p>` : ''}\n      <p class=\"testimonial-author\">— ${r.name}</p>\n      <span class=\"testimonial-verified\">${TRANSLATIONS[currentLang].reviewVerified}</span>\n    </div>\n  `).join('');\n  const agg = document.querySelector('.testimonials-aggregate');\n  if (agg) {\n    const avg = (data.reduce((s, r) => s + r.rating, 0) / data.length).toFixed(1);\n    agg.innerHTML = `<span class=\"agg-stars\">${'★'.repeat(Math.round(avg))}</span><span class=\"agg-score\">${avg}</span> · ${data.length} ביקורות`;\n  }\n}\nloadReviews();\n\n// === ENHANCEMENT 1: SCROLL-TRIGGERED ANIMATIONS ===\n(function() {\n  // Selectors for elements to animate on scroll\n  const revealSelectors = [\n    '.section-header',\n    '.about-grid',\n    '.delivery-card',\n    '.choose-card',\n    '.gift-card',\n    '.b2b-grid',\n    '.cta-inner',\n    '.testimonials-inner',\n    '.category-nav-cards',\n    '.reviews-form-inner',\n    '.trust-strip .trust-inner'\n  ];\n\n  // Gather all elements\n  const revealElements = [];\n  revealSelectors.forEach(sel => {\n    document.querySelectorAll(sel).forEach(el => revealElements.push(el));\n  });\n\n  // Detect which elements are already in the viewport on page load\n  // (so we don't animate things the user can already see)\n  const viewportHeight = window.innerHeight;\n  const initiallyVisible = new Set();\n  revealElements.forEach(el => {\n    const rect = el.getBoundingClientRect();\n    if (rect.top < viewportHeight && rect.bottom > 0) {\n      initiallyVisible.add(el);\n    }\n  });\n\n  // Apply reveal-hidden only to elements NOT in initial viewport\n  revealElements.forEach(el => {\n    if (!initiallyVisible.has(el)) {\n      el.classList.add('reveal-hidden');\n    }\n  });\n\n  // Add stagger delays to sibling groups (e.g. delivery cards, choose cards)\n  const siblingGroups = [\n    '.delivery-card',\n    '.choose-card',\n    '.gift-card',\n    '.trust-item',\n    '.b2b-card'\n  ];\n  siblingGroups.forEach(sel => {\n    document.querySelectorAll(sel).forEach((el, i) => {\n      if (!initiallyVisible.has(el)) {\n        el.classList.add('reveal-hidden');\n        if (i > 0 && i <= 5) el.classList.add('reveal-delay-' + i);\n      }\n    });\n  });\n\n  // IntersectionObserver — triggers .reveal-visible when element enters viewport\n  const observer = new IntersectionObserver((entries) => {\n    entries.forEach(entry => {\n      if (entry.isIntersecting) {\n        entry.target.classList.add('reveal-visible');\n        observer.unobserve(entry.target); // only animate once\n      }\n    });\n  }, {\n    threshold: 0.12,\n    rootMargin: '0px 0px -40px 0px'\n  });\n\n  // Observe all hidden elements\n  document.querySelectorAll('.reveal-hidden').forEach(el => observer.observe(el));\n})();\n// === END ENHANCEMENT 1 ===\n\n// === ENHANCEMENT 4: STAGGERED PRODUCT CARD ENTRANCE ===\n// Safe approach: cards are always visible by default.\n// Animation only plays as a nice-to-have when grid scrolls into view.\n(function() {\n  const productsGrid = document.getElementById('products-grid');\n  if (!productsGrid) return;\n\n  // Add stagger classes to cards (just for animation-delay, no hiding)\n  function tagCards() {\n    productsGrid.querySelectorAll('.product-card').forEach((card, i) => {\n      card.classList.add('card-stagger-' + (i % 10));\n    });\n  }\n\n  // When grid enters viewport, trigger the entrance animation\n  const cardObserver = new IntersectionObserver((entries) => {\n    entries.forEach(entry => {\n      if (entry.isIntersecting) {\n        productsGrid.querySelectorAll('.product-card').forEach(card => {\n          card.classList.add('card-animate');\n        });\n        cardObserver.unobserve(entry.target);\n      }\n    });\n  }, { threshold: 0.02 });\n\n  cardObserver.observe(productsGrid);\n  tagCards();\n})();\n// === END ENHANCEMENT 4 ===\n<\/script>\n\n\n</body></html>","about":"<!DOCTYPE html>\n<html lang=\"he\" dir=\"rtl\"><head>\n<meta charset=\"UTF-8\">\n<link rel=\"icon\" href=\"data:image/svg+xml,&lt;svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'&gt;&lt;text y='.9em' font-size='90'&gt;🏺&lt;/text&gt;&lt;/svg&gt;\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>הסיפור שלי | נעמי גולדמן</title>\n<meta name=\"description\" content=\"הסיפור של נעמי גולדמן — יוצרת כלי קרמיקה בעבודת יד מגבעות. איך הכל התחיל, הפילוסופיה, והסטודיו.\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin=\"\">\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@300;400;600&amp;family=Heebo:wght@300;400;500&amp;display=swap\" rel=\"stylesheet\">\n\n<style>\n  /* ─── DESIGN TOKENS ─── */\n  :root {\n    --clay:      #5c4a32;\n    --earth:     #3d3020;\n    --olive:     #4a4a2a;\n    --cream:     #f5f0e8;\n    --linen:     #ede6d8;\n    --warm-white:#faf7f2;\n    --gold:      #c9a96e;\n    --gold-light:#e8d5a8;\n    --text:      #2a2017;\n    --text-soft: #6b5c44;\n    --border:    #d4c4a8;\n    --wa-green:  #25D366;\n    --shadow:    0 4px 24px rgba(60,40,10,0.10);\n    --shadow-lg: 0 12px 48px rgba(60,40,10,0.16);\n    --radius:    2px;\n    --serif:     'Noto Serif Hebrew', serif;\n    --sans:      'Heebo', sans-serif;\n  }\n\n  /* ─── RESET & BASE ─── */\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n  html { scroll-behavior: smooth; }\n\n  body {\n    font-family: var(--sans);\n    background: var(--warm-white);\n    color: var(--text);\n    line-height: 1.7;\n    overflow-x: hidden;\n  }\n\n  img { display: block; max-width: 100%; }\n  a { color: inherit; text-decoration: none; }\n\n  /* ─── NOISE TEXTURE OVERLAY ─── */\n  body::before {\n    content: '';\n    position: fixed;\n    inset: 0;\n    background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E\");\n    pointer-events: none;\n    z-index: 9999;\n    opacity: 0.4;\n  }\n  @media (max-width: 900px) {\n    body::before { display: none; }\n  }\n\n  /* ─── ANNOUNCEMENT BAR ─── */\n  .announcement-bar {\n    background: var(--clay);\n    color: var(--gold-light);\n    text-align: center;\n    padding: 10px 20px;\n    font-family: var(--serif);\n    font-size: 0.85rem;\n    letter-spacing: 0.04em;\n    position: relative;\n    min-height: 2.4em;\n    overflow: hidden;\n  }\n  .announcement-bar .ann-msg {\n    position: absolute;\n    inset: 0;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    padding: 10px 20px;\n    opacity: 0;\n    transition: opacity 0.6s ease;\n    pointer-events: none;\n  }\n  .announcement-bar .ann-msg.active {\n    opacity: 1;\n    pointer-events: auto;\n  }\n  @media (max-width: 600px) {\n    .announcement-bar { min-height: 3.2em; }\n  }\n\n  /* ─── HEADER ─── */\n  header {\n    position: sticky;\n    top: 0;\n    z-index: 100;\n    background: rgba(250, 247, 242, 0.95);\n    backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--border);\n    padding: 0 40px;\n  }\n\n  .header-inner {\n    max-width: 1200px;\n    margin: 0 auto;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    height: 72px;\n  }\n\n  .logo {\n    font-family: var(--serif);\n    font-size: 1.4rem;\n    font-weight: 600;\n    color: var(--earth);\n    line-height: 1.2;\n  }\n  .logo span {\n    display: block;\n    font-size: 0.7rem;\n    font-weight: 300;\n    color: var(--text-soft);\n    letter-spacing: 0.12em;\n    font-family: var(--sans);\n  }\n\n  nav { display: flex; gap: 32px; align-items: center; }\n  nav a {\n    font-size: 0.9rem;\n    color: var(--text-soft);\n    font-weight: 400;\n    transition: color 0.2s;\n    letter-spacing: 0.02em;\n  }\n  nav a:hover { color: var(--clay); }\n\n  .nav-wa {\n    background: var(--wa-green);\n    color: white !important;\n    padding: 9px 20px;\n    border-radius: 30px;\n    font-weight: 500;\n    font-size: 0.85rem;\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    transition: transform 0.2s, box-shadow 0.2s;\n  }\n  .nav-wa:hover {\n    transform: translateY(-1px);\n    box-shadow: 0 4px 16px rgba(37,211,102,0.35);\n  }\n\n  /* ── LANGUAGE TOGGLE ── */\n  .lang-toggle {\n    background: transparent;\n    border: 1.5px solid var(--border);\n    color: var(--text-soft);\n    font-family: var(--sans);\n    font-size: 0.78rem;\n    font-weight: 500;\n    letter-spacing: 0.1em;\n    padding: 6px 14px;\n    border-radius: 20px;\n    cursor: pointer;\n    transition: all 0.2s;\n    margin-right: 12px;\n  }\n  .lang-toggle:hover {\n    border-color: var(--clay);\n    color: var(--clay);\n  }\n  .lang-toggle.active-en {\n    background: var(--clay);\n    color: white;\n    border-color: var(--clay);\n  }\n\n  /* ─── HAMBURGER ─── */\n  .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 6px; flex-direction: column; gap: 5px; z-index: 101; }\n  .hamburger span { display: block; width: 22px; height: 2px; background: var(--clay); border-radius: 2px; transition: 0.3s; }\n  .hamburger.open span:nth-child(1) { transform: rotate(45deg) translateY(7px); }\n  .hamburger.open span:nth-child(2) { opacity: 0; }\n  .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translateY(-7px); }\n\n  .mobile-nav {\n    position: fixed; top: 72px; right: 0; width: 100%; z-index: 99;\n    background: rgba(250,247,242,0.98); backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--border);\n    max-height: 0; overflow: hidden; transition: max-height 0.35s ease;\n    display: flex; flex-direction: column; align-items: center; gap: 0;\n    pointer-events: none;\n  }\n  .mobile-nav.open { max-height: 300px; pointer-events: auto; }\n  .mobile-nav a {\n    display: block; width: 100%; text-align: center; padding: 16px;\n    font-family: var(--sans); font-size: 1rem; color: var(--text-soft);\n    text-decoration: none; border-bottom: 1px solid var(--border);\n  }\n  .mobile-nav a:last-child { border-bottom: none; }\n  .mobile-nav .mobile-nav-wa {\n    background: var(--wa-green); color: white; font-weight: 500;\n    border-bottom: none; margin: 12px 20px; border-radius: 30px;\n    width: auto; padding: 12px 28px;\n  }\n\n  /* ─── SECTION SHARED ─── */\n  .section {\n    max-width: 1200px;\n    margin: 0 auto;\n    padding: 80px 40px;\n  }\n\n  .section-header {\n    text-align: center;\n    margin-bottom: 56px;\n  }\n\n  .section-label {\n    font-size: 0.72rem;\n    letter-spacing: 0.22em;\n    color: var(--gold);\n    text-transform: uppercase;\n    font-family: var(--sans);\n    font-weight: 400;\n    margin-bottom: 12px;\n  }\n\n  .section-title {\n    font-family: var(--serif);\n    font-size: clamp(1.8rem, 3vw, 2.6rem);\n    font-weight: 300;\n    color: var(--earth);\n    line-height: 1.3;\n  }\n\n  /* ─── SECTION 1: OPENING PULL QUOTE (HERO) ─── */\n  .about-hero {\n    background: var(--olive);\n    padding: 80px 40px;\n    text-align: center;\n  }\n\n יצא הכי יפה נותנת לסבא ולסבתא. להחזיר אהבה.',\n    originP2: 'עברו שנים. הילדה עם הקוקיות הלכה ללמוד קרמיקה בבצלאל. אחרי כן הקמתי משפחה, ילדתי אחד עשר ילדים ב״ה, גדלתי איתם — בבית, בגן שבניתי בשבילם, ותמיד גם בסטודיו, שהיה שם כל השנים לצד הבית. היום, כשהילדים ואני כבר לא בגן, אני רוב היום בסטודיו — ועדיין יש צביטה בסוף כל יום. לא הספקתי הכל. מלאי הרעיונות רק גדל. אני רוצה ליצור עוד ועוד.',\n    originP3: 'הסטודיו שלי בגבעות — ישוב המשלב אנשים עם צרכים מיוחדים. כל אחד אהוב, לכל אחד יש מקום. אני מרגישה שזה מחלחל גם ליצירה שלי. מושלם זאת לא השאיפה. כשילדים, תלמידות ואנשים עם צרכים מיוחדים מגיעים לסטודיו ויוצרים — הם מוסיפים רכות וקבלה. הקבלה הזו לא מחלישה את היצירה — היא מה שמאפשרת אותה ומזינה אותה.',\n    originImgAlt: 'תמונה של נעמי בסטודיו',\n    philoLabel: 'מה מנחה אותי',\n    philoTitle: 'מה אני מאמינה',\n    philo1Title: 'כלי שנוצר ביד נושא זיכרון',\n    philo1Desc: 'הוא יידע מתי נוצר, על ידי מי, ועבור מה',\n    philo2Title: 'האש מחליטה',\n    philo2Desc: 'אני שולטת ב-90% מהתהליך. ה-10% האחרונים שייכים לכבשן — וזה מה שהופך כל כלי לייחודי',\n    philo3Title: 'יופי יומיומי',\n    philo3Desc: 'כלי יפה על השולחן משנה את האווירה של הארוחה כולה. יופי הוא לא מותרות — הוא הכרחי',\n    studioTitle: 'הסטודיו בגבעות',\n    studioText: 'הסטודיו שלי קטן ושקט — שולחן אחד, כבשן אחד, ובוקר שמתחיל לפני שהעולם מתעורר. כל כלי נוצר פה בסדרות קטנות, בלי מכונות ובלי לחץ. הנוף של גבעות — האבן הבהירה, הירוק האפרפר של עצי הזית, האור החזק של הבוקר — חודר לצבעים ולמרקם של הכלים. זה לא דבר שאני מתכננת, זה פשוט קורה כשעובדים במקום הנכון.',\n    studioImgAlt: 'הסטודיו בגבעות',\n    trustNum1: '8+',\n    trustLabel1: 'שנות יצירה',\n    trustNum2: 'מאות בתים',\n    trustLabel2: 'בישראל שכבר מכילים כלי',\n    trustNum3: 'כל כלי',\n    trustLabel3: 'נוצר ביד, לעולם לא ייוצר שוב בדיוק אותו הדבר',\n    ctaTitle: 'רוצה כלי שיספר סיפור?',\n    ctaBtn: 'בואי נדבר ←',\n    footerTagline: 'כלי קרמיקה בעבודת יד. כל כלי נוצר במגע יד ותפילה — כלים שמשפיעים אור וחמימות בבית.',\n    footerNav: 'ניווט',\n => { if (mobileLinks[i]) mobileLinks[i].textContent = t[k]; });\n  const mobileWa = document.querySelector('.mobile-nav-wa');\n  if (mobileWa) mobileWa.textContent = t.navWa;\n\n  // Hero\n  const heroQuote = document.querySelector('.about-hero-quote');\n  const heroSub = document.querySelector('.about-hero-sub');\n  if (heroQuote) heroQuote.textContent = t.heroQuote;\n  if (heroSub) heroSub.textContent = t.heroSub;\n\n  // Origin\n  const originTitle = document.querySelector('.origin-text h2');\n  const originPs = document.querySelectorAll('.origin-text p');\n  if (originTitle) originTitle.textContent = t.originTitle;\n  if (originPs[0]) originPs[0].textContent = t.originP1;\n  if (originPs[1]) originPs[1].textContent = t.originP2;\n  if (originPs[2]) originPs[2].textContent = t.originP3;\n  const originImg = document.querySelector('.origin-image-placeholder');\n  if (originImg) originImg.alt = t.originImgAlt;\n\n  // Philosophy\n  const philoLabel = document.querySelector('.philosophy-section .section-label');\n  const philoTitle = document.querySelector('.philosophy-section .section-title');\n  if (philoLabel) philoLabel.textContent = t.philoLabel;\n  if (philoTitle) philoTitle.textContent = t.philoTitle;\n  const philoCards = document.querySelectorAll('.philosophy-card');\n  const philoKeys = [\n    { title: 'philo1Title', desc: 'philo1Desc' },\n    { title: 'philo2Title', desc: 'philo2Desc' },\n    { title: 'philo3Title', desc: 'philo3Desc' },\n  ];\n  philoCards.forEach((card, i) => {\n    const titleEl = card.querySelector('.philosophy-title');\n    const descEl = card.querySelector('.philosophy-desc');\n    if (titleEl && philoKeys[i]) titleEl.textContent = t[philoKeys[i].title];\n    if (descEl && philoKeys[i]) descEl.textContent = t[philoKeys[i].desc];\n  });\n\n  // Studio\n  const studioTitle = document.querySelector('.studio-text h2');\n  const studioText = document.querySelector('.studio-text p');\n  const studioImg = document.querySelector('.studio-image-placeholder');\n  if (studioTitle) studioTitle.textContent = t.studioTitle;\n  if (studioText) studioText.textContent = t.studioText;\n  if (studioImg) studioImg.textContent = t.studioImgAlt;\n\n  // Trust numbers\n  const trustStats = document.querySelectorAll('.trust-stat');\n  const trustKeys = [\n    { num: 'trustNum1', label: 'trustLabel1' },\n    { num: 'trustNum2', label: 'trustLabel2' },\n    { num: 'trustNum3', label: 'trustLabel3' },\n  ];\n  trustStats.forEach((stat, i) => {\n    const numEl = stat.querySelector('.trust-stat-number');\n    const labelEl = stat.querySelector('.trust-stat-label');\n    if (numEl && trustKeys[i]) numEl.textContent = t[trustKeys[i].num];\n    if (labelEl && trustKeys[i]) labelEl.textContent = t[trustKeys[i].label];\n  });\n\n  // CTA\n  const ctaTitle = document.querySelector('.cta-title');\n  if (ctaTitle) ctaTitle.textContent = t.ctaTitle;\n  const ctaBtn = document.querySelector('.cta-wa-btn');\n  if (ctaBtn) ctaBtn.childNodes[ctaBtn.childNodes.length - 1].textContent = ' ' + t.ctaBtn;\n\n  // Footer\n  const footTagline = document.querySelector('.footer-brand-text');\n  const footCopy = document.querySelector('.footer-bottom span:first-child');\n  const footLoc = document.querySelector('.footer-bottom span:last-child');\n  const footColTitles = document.querySelectorAll('.footer-col-title');\n  if (footTagline) footTagline.textContent = t.footerTagline;\n  if (footCopy) footCopy.textContent = t.footerCopyright;\n  if (footLoc) footLoc.textContent = t.footerLocation;\n  if (footColTitles[0]) footColTitles[0].textContent = t.footerNav;\n  if (footColTitles[1]) footColTitles[1].textContent = t.footerContact;\n\n  const footLinks = document.querySelectorAll('.footer-links');\n  if (footLinks[0]) {\n    const links = footLinks[0].querySelectorAll('a');\n    const navTexts = [t.navProducts, t.navStory, t.navFaq, t.navMaterials];\n    links.forEach((a, i) => { if (navTexts[i]) a.textContent = navTexts[i]; });\n  }\n}\n\n// ─ er-radius: 20px;\n    cursor: pointer;\n    transition: all 0.2s;\n    margin-right: 12px;\n  }\n  .lang-toggle:hover {\n    border-color: var(--clay);\n    color: var(--clay);\n  }\n  .lang-toggle.active-en {\n    background: var(--clay);\n    color: white;\n    border-color: var(--clay);\n  }\n\n  /* ─── HAMBURGER ─── */\n  .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 6px; flex-direction: column; gap: 5px; z-index: 101; }\n  .hamburger span { display: block; width: 22px; height: 2px; background: var(--clay); border-radius: 2px; transition: 0.3s; }\n  .hamburger.open span:nth-child(1) { transform: rotate(45deg) translateY(7px); }\n  .hamburger.open span:nth-child(2) { opacity: 0; }\n  .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translateY(-7px); }\n\n  .mobile-nav {\n    position: fixed; top: 72px; right: 0; width: 100%; z-index: 99;\n    background: rgba(250,247,242,0.98); backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--border);\n    max-height: 0; overflow: hidden; transition: max-height 0.35s ease;\n    display: flex; flex-direction: column; align-items: center; gap: 0;\n    pointer-events: none;\n  }\n  .mobile-nav.open { max-height: 300px; pointer-events: auto; }\n  .mobile-nav a {\n    display: block; width: 100%; text-align: center; padding: 16px;\n    font-family: var(--sans); font-size: 1rem; color: var(--text-soft);\n    text-decoration: none; border-bottom: 1px solid var(--border);\n  }\n  .mobile-nav a:last-child { border-bottom: none; }\n  .mobile-nav .mobile-nav-wa {\n    background: var(--wa-green); color: white; font-weight: 500;\n    border-bottom: none; margin: 12px 20px; border-radius: 30px;\n    width: auto; padding: 12px 28px;\n  }\n\n  /* ─── PAGE HERO (small) ─── */\n  .page-hero {\n    background: var(--olive);\n    text-align: center;\n    padding: 60px 40px;\n  }\n\n  .page-hero-label {\n    font-size: 0.75rem;\n    letter-spacing: 0.2em;\n    color: var(--gold);\n n  },\n  en: {\n    pageTitle: 'FAQ | Naomi Goldman',\n    langBtn: 'עב',\n    dir: 'ltr',\n    lang: 'en',\n    announcement1: 'Every piece is handmade in my studio in Gvaot - Shipping nationwide',\n    announcement2: 'You are welcome to visit the studio in Gvaot - By appointment via WhatsApp',\n    navProducts: 'Shop',\n    navStory: 'My Story',\n    navFaq: 'FAQ',\n    navMaterials: 'My Materials',\n    navWa: 'Order on WhatsApp',\n    heroLabel: 'Everything you wanted to know',\n    heroTitle: 'FAQ',\n    heroSubtitle: \"Can't find an answer? Send a WhatsApp message and I'll reply within an hour\",\n    group1: 'About the Pieces',\n    q1_1: 'Are the pieces dishwasher safe?',\n    a1_1: 'Yes, all pieces are fired at 1240°C and are dishwasher safe. A gentle cycle is recommended.',\n    q1_2: 'Are they microwave safe?',\n    a1_2: 'Yes, the pieces are microwave safe — no metal in the glazes.',\n    q1_3: 'Is each piece unique?',\n    a1_3: 'Yes. Each piece is hand-thrown on a wheel, so there are subtle variations in shape, shade, and texture — that\\'s part of the beauty.',\n    q1_4: 'Are the glazes food safe?',\n    a1_4: 'Yes, all glazes are food-safe and comply with European regulations.',\n    group2: 'Ordering & Payment',\n    q2_1: 'How do I order?',\n    a2_1: 'Click on the piece you want, a WhatsApp chat opens, and I\\'ll confirm availability and send payment details within an hour during business days.',\n    q2_2: 'What payment methods are accepted?',\n    a2_2: 'Bank transfer, Bit, and PayBox.',\n    q2_3: 'Can I order a sold-out item?',\n    a2_3: 'Yes. Send a WhatsApp message and I\\'ll add you to the waitlist for the next batch.',\n    q2_4: 'Is there a minimum order?',\n    a2_4: 'No. You can order even a single piece.',\n    group3: 'Shipping & Packaging',\n    q3_1: 'How long does shipping take?',\n    a3_1: '3-5 business days across Israel. Each piece is wrapped in bubble wrap and packed in a sturdy box.',\n    q3_2: 'Is the packaging gift-ready?',\n    a3_2: 'Yes. Add a note to your order and I\\'ll wrap it specially with a handwritten greeting card.',\n    q3_3: 'What if the piece breaks during shipping?',\n    a3_3: 'Photograph the package upon opening and send the picture — I\\'ll replace it at no charge.',\n    q3_4: 'Can I pick up in person?',\n    a3_4: 'Yes, from the studio in Gvaot — by appointment via WhatsApp.',\n    group4: 'Care & Maintenance',\n    q4_1: 'How do I care for the pieces long-term?',\n    a4_1: 'Avoid sudden temperature changes (e.g., fridge straight to oven). Dishwasher — perfectly fine.',\n    q4_2: 'Does the color fade over time?',\n    a4_2: 'No. The glaze is permanently fused in the kiln at 1240°C — the color will never change.',\n    ctaTitle: 'Still have a question?',\n    ctaBtn: 'Message on WhatsApp →',\n    footerTagline: 'Handmade ceramics. Each piece is shaped by hand and prayer — bringing light and warmth into your home.',\n    footerNav: 'Navigate',\n    footerContact: 'Contact',\n    footerCopyright: '© 2025 Naomi Goldman | Handmade Ceramics',\n    footerLocation: 'Gvaot, Israel',\n  }\n};\n\nlet currentLang = 'he';\n\nfunction toggleLanguage() {\n  currentLang = currentLang === 'he' ? 'en' : 'he';\n  applyLanguage(currentLang);\n  localStorage.setItem('naomi-lang', currentLang);\n}\n\nfunction applyLanguage(lang) {\n  const t = TRANSLATIONS[lang];\n  const html = document.documentElement;\n  html.setAttribute('dir', t.dir);\n  html.setAttribute('lang', t.lang);\n  document.title = t.pageTitle;\n\n  // Lang button\n  const btn = document.getElementById('lang-toggle');\n  if (btn) {\n    btn.textContent = t.langBtn;\n    btn.classList.toggle('active-en', lang === 'en');\n    btn.title = lang === 'he' ? 'Switch to English' : 'עבור לעברית';\n  }\n\n  // Announcement\n  const annMsg1 = document.getElementById('ann-msg-1');\n  const annMsg2 = document.getElementById('ann-msg-2');\n  if (annMsg1) annMsg1.textContent = t.announcement1;\n  if (annMsg2) annMsg2.textContent = t.announcement2;\n\n  // Nav\n  const navLinks = document.querySelectorAll('nav a:not(.nav-wa)');\n  ['navProducts', 'navStory', 'navFaq', 'navMaterials'].forEach((k, i) => { if (navLinks[i]) navLinks[i].textContent = t[k]; });\n  const navWa = document.querySelector('.nav-wa');\n  if (navWa) navWa.childNodes[navWa.childNodes.length - 1].textContent = ' ' + t.navWa;\n\n  // Mobile nav\n  const mobileLinks = document.querySelectorAll('#mobile-nav a:not(.mobile-nav-wa)');\n  ['navProducts', 'navStory', 'navFaq', 'navMaterials'].forEach((k, i) => { if (mobileLinks[i]) mobileLinks[i].textContent = t[k]; });\n  const mobileWa = document.querySelector('.mobile-nav-wa');\n  if (mobileWa) mobileWa.textContent = t.navWa;\n\n  // Hero\n  const heroLabel = document.querySelector('.page-hero-label');\n  const heroTitle = document.querySelector('.page-hero-title');\n  const heroSub = document.querySelector('.page-hero-subtitle');\n  if (heroLabel) heroLabel.textContent = t.heroLabel;\n  if (heroTitle) heroTitle.textContent = t.heroTitle;\n  if (heroSub) heroSub.textContent = t.heroSubtitle;\n\n  // FAQ groups\n  const groups = document.querySelectorAll('.faq-group');\n  const groupKeys = ['group1', 'group2', 'group3', 'group4'];\n  const qaCounts = [4, 4, 4, 2];\n  groups.forEach((group, gi) => {\n    const title = group.querySelector('.faq-group-title');\n    if (title) title.textContent = t[groupKeys[gi]];\n    const details = group.querySelectorAll('details');\n    details.forEach((d, qi) => {\n      const qKey = 'q' + (gi + 1) + '_' + (qi + 1);\n      const aKey = 'a' + (gi + 1) + '_' + (qi + 1);\n      const summary = d.querySelector('summary');\n      const answer = d.querySelector('.faq-answer');\n      if (summary && t[qKey]) summary.textContent = t[qKey];\n      if (answer && t[aKey]) answer.textContent = t[aKey];\n    });\n  });\n\n  // CTA\n  const ctaTitle = document.querySelector('.cta-title');\n  if (ctaTitle) ctaTitle.textContent = t.ctaTitle;\n  const ctaBtn = document.querySelector('.cta-wa-btn');\n  if (ctaBtn) ctaBtn.childNodes[ctaBtn.childNodes.length - 1].textContent = ' ' + t.ctaBtn;\n\n  // Footer\n  const footTagline = document.querySelector('.footer-brand-text');\n  const footCopy = document.querySelector('.footer-bottom span:first-child');\n  const footLoc = document.querySelector('.footer-bottom span:last-child');\n  const footColTitles = document.querySelectorAll('.footer-col-title');\n  if (footTagline) footTagline.textContent = t.footerTagline;\n  if (footCopy) footCopy.textContent = t.footerCopyright;\n  if (footLoc) footLoc.textContent = t.footerLocation;\n  if (footColTitles[0]) footColTitles[0].textContent = t.footerNav;\n  if (footColTitles[1]) footColTitles[1].textContent = t.footerContact;\n\n  // Footer nav links\n  const footLinks = document.querySelectorAll('.footer-links');\n  if (footLinks[0]) {\n    const links = footLinks[0].querySelectorAll('a');\n    const navTexts = [t.navProducts, t.navStory, t.navFaq, t.navMaterials];\n    links.forEach((a, i) => { if (navTexts[i]) a.textContent = navTexts[i]; });\n  }\n}\n\n// ─── INIT ───\n(function() {\n  const saved = localStorage.getItem('naomi-lang');\n  if (saved && saved !== 'he') {\n    currentLang = saved;\n    applyLanguage(currentLang);\n  }\n\n  // Hamburger\n  const hamburger = document.getElementById('hamburger-btn');\n  const mobileNav = document.getElementById('mobile-nav');\n  hamburger.addEventListener('click', () => {\n    hamburger.classList.toggle('open');\n    mobileNav.classList.toggle('open');\n  });\n  document.querySelectorAll('#mobile-nav a').forEach(a => {\n    a.addEventListener('click', () => {\n      hamburger.classList.remove('open');\n      mobileNav.classList.remove('open');\n    });\n  });\n})();\n\n// ── ANNOUNCEMENT BAR ROTATION ──\n(function() {\n  const msg1 = document.getElementById('ann-msg-1');\n  const msg2 = document.getElementById('ann-msg-2');\n  if (!msg1 || !msg2) return;\n  let showing = 1;\n  setInterval(() => {\n    if (showing === 1) {\n      msg1.classList.remove('active');\n      msg2.classList.add('active');\n      showing = 2;\n    } else {\n      msg2.classList.remove('active');\n      msg1.classList.add('active');\n      showing = 1;\n    }\n  }, 4000);\n})();\n<\/script>\n\n</body>\n</html>","materials":"<!DOCTYPE html>\n<html lang=\"he\" dir=\"rtl\">\n<head>\n<meta charset=\"UTF-8\">\n<link rel=\"icon\" href=\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏺</text></svg>\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>החומרים שלי | נעמי גולדמן</title>\n<meta name=\"description\" content=\"החומרים שעומדים מאחורי כלי הקרמיקה של נעמי גולדמן — חימר, זיגוגים, ושריפה בכבשן ב-1240 מעלות\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+Hebrew:wght@300;400;600&family=Heebo:wght@300;400;500&display=swap\" rel=\"stylesheet\">\n\n<style>\n  /* ─── DESIGN TOKENS ─── */\n  :root {\n    --clay:      #5c4a32;\n    --earth:     #3d3020;\n    --olive:     #4a4a2a;\n    --cream:     #f5f0e8;\n    --linen:     #ede6d8;\n    --warm-white:#faf7f2;\n    --gold:      #c9a96e;\n    --gold-light:#e8d5a8;\n    --text:      #2a2017;\n    --text-soft: #6b5c44;\n    --border:    #d4c4a8;\n    --wa-green:  #25D366;\n    --shadow:    0 4px 24px rgba(60,40,10,0.10);\n    --shadow-lg: 0 12px 48px rgba(60,40,10,0.16);\n    --radius:    2px;\n    --serif:     'Noto Serif Hebrew', serif;\n    --sans:      'Heebo', sans-serif;\n  }\n\n  /* ─── RESET & BASE ─── */\n  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }\n\n  html { scroll-behavior: smooth; }\n\n  body {\n    font-family: var(--sans);\n    background: var(--warm-white);\n    color: var(--text);\n    line-height: 1.7;\n    overflow-x: hidden;\n  }\n\n  img { display: block; max-width: 100%; }\n  a { color: inherit; text-decoration: none; }\n\n  /* ─── NOISE TEXTURE OVERLAY ─── */\n  body::before {\n    content: '';\n    position: fixed;\n    inset: 0;\n    background-image: url(\"data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E\");\n    pointer-events: none;\n    z-index: 9999;\n    opacity: 0.4;\n  }\n  @media (max-width: 900px) {\n    body::before { display: none; }\n  }\n\n  /* ─── ANNOUNCEMENT BAR ─── */\n  .announcement-bar {\n    background: var(--clay);\n    color: var(--gold-light);\n    text-align: center;\n    padding: 10px 20px;\n    font-family: var(--serif);\n    font-size: 0.85rem;\n    letter-spacing: 0.04em;\n    position: relative;\n    min-height: 2.4em;\n    overflow: hidden;\n  }\n  .announcement-bar .ann-msg {\n    position: absolute;\n    inset: 0;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    padding: 10px 20px;\n    opacity: 0;\n    transition: opacity 0.6s ease;\n    pointer-events: none;\n  }\n  .announcement-bar .ann-msg.active {\n    opacity: 1;\n    pointer-events: auto;\n  }\n  @media (max-width: 600px) {\n    .announcement-bar { min-height: 3.2em; }\n  }\n\n  /* ─── HEADER ─── */\n  header {\n    position: sticky;\n    top: 0;\n    z-index: 100;\n    background: rgba(250, 247, 242, 0.95);\n    backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--border);\n    padding: 0 40px;\n  }\n\n  .header-inner {\n    max-width: 1200px;\n    margin: 0 auto;\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    height: 72px;\n  }\n\n  .logo {\n    font-family: var(--serif);\n    font-size: 1.4rem;\n    font-weight: 600;\n    color: var(--earth);\n    line-height: 1.2;\n  }\n  .logo span {\n    display: block;\n    font-size: 0.7rem;\n    font-weight: 300;\n    color: var(--text-soft);\n    letter-spacing: 0.12em;\n    font-family: var(--sans);\n  }\n\n  nav { display: flex; gap: 32px; align-items: center; }\n  nav a {\n    font-size: 0.9rem;\n    color: var(--text-soft);\n    font-weight: 400;\n    transition: color 0.2s;\n    letter-spacing: 0.02em;\n  }\n  nav a:hover { color: var(--clay); }\n\n  .nav-wa {\n    background: var(--wa-green);\n    color: white !important;\n    padding: 9px 20px;\n    border-radius: 30px;\n    font-weight: 500;\n    font-size: 0.85rem;\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    transition: transform 0.2s, box-shadow 0.2s;\n  }\n  .nav-wa:hover {\n    transform: translateY(-1px);\n    box-shadow: 0 4px 16px rgba(37,211,102,0.35);\n  }\n\n  /* ── LANGUAGE TOGGLE ── */\n  .lang-toggle {\n    background: transparent;\n    border: 1.5px solid var(--border);\n    color: var(--text-soft);\n    font-family: var(--sans);\n    font-size: 0.78rem;\n    font-weight: 500;\n    letter-spacing: 0.1em;\n    padding: 6px 14px;\n    border-radius: 20px;\n    cursor: pointer;\n    transition: all 0.2s;\n    margin-right: 12px;\n  }\n  .lang-toggle:hover {\n    border-color: var(--clay);\n    color: var(--clay);\n  }\n  .lang-toggle.active-en {\n    background: var(--clay);\n    color: white;\n    border-color: var(--clay);\n  }\n\n  /* ─── HAMBURGER ─── */\n  .hamburger { display: none; background: none; border: none; cursor: pointer; padding: 6px; flex-direction: column; gap: 5px; z-index: 101; }\n  .hamburger span { display: block; width: 22px; height: 2px; background: var(--clay); border-radius: 2px; transition: 0.3s; }\n  .hamburger.open span:nth-child(1) { transform: rotate(45deg) translateY(7px); }\n  .hamburger.open span:nth-child(2) { opacity: 0; }\n  .hamburger.open span:nth-child(3) { transform: rotate(-45deg) translateY(-7px); }\n\n  .mobile-nav {\n    position: fixed; top: 72px; right: 0; width: 100%; z-index: 99;\n    background: rgba(250,247,242,0.98); backdrop-filter: blur(12px);\n    border-bottom: 1px solid var(--border);\n    max-height: 0; overflow: hidden; transition: max-height 0.35s ease;\n    display: flex; flex-direction: column; align-items: center; gap: 0;\n    pointer-events: none;\n  }\n  .mobile-nav.open { max-height: 300px; pointer-events: auto; }\n  .mobile-nav a {\n    display: block; width: 100%; text-align: center; padding: 16px;\n    font-family: var(--sans); font-size: 1rem; color: var(--text-soft);\n    text-decoration: none; border-bottom: 1px solid var(--border);\n  }\n  .mobile-nav a:last-child { border-bottom: none; }\n  .mobile-nav .mobile-nav-wa {\n    background: var(--wa-green); color: white; font-weight: 500;\n    border-bottom: none; margin: 12px 20px; border-radius: 30px;\n    width: auto; padding: 12px 28px;\n  }\n\n  /* ─── PAGE HERO ─── */\n  .page-hero {\n    background: var(--olive);\n    text-align: center;\n    padding: 60px 40px;\n  }\n\n  .page-hero-label {\n    font-size: 0.75rem;\n    letter-spacing: 0.2em;\n    color: var(--gold);\n    text-transform: uppercase;\n    font-family: var(--sans);\n    font-weight: 300;\n    margin-bottom: 16px;\n  }\n\n  .page-hero-title {\n    font-family: var(--serif);\n    font-size: clamp(2rem, 4vw, 3rem);\n    font-weight: 300;\n    color: var(--gold-light);\n    line-height: 1.3;\n    margin-bottom: 16px;\n  }\n\n  .page-hero-subtitle {\n    font-family: var(--serif);\n    font-size: 1rem;\n    color: rgba(232, 213, 168, 0.65);\n    font-weight: 300;\n    line-height: 1.8;\n    max-width: 560px;\n    margin: 0 auto;\n  }\n\n  /* ─── SECTION SHARED ─── */\n  .section {\n    max-width: 1200px;\n    margin: 0 auto;\n    padding: 80px 40px;\n  }\n\n  .section-header {\n    text-align: center;\n    margin-bottom: 56px;\n  }\n\n  .section-title {\n    font-family: var(--serif);\n    font-size: clamp(1.8rem, 3vw, 2.6rem);\n    font-weight: 300;\n    color: var(--earth);\n    line-height: 1.3;\n  }\n\n  .section-desc {\n    color: var(--text-soft);\n    max-width: 520px;\n    margin: 16px auto 0;\n    font-size: 0.95rem;\n    line-height: 1.8;\n  }\n\n  /* ─── CLAY SECTION ─── */\n  .clay-section {\n    background: var(--linen);\n    border-top: 1px solid var(--border);\n    border-bottom: 1px solid var(--border);\n  }\n\n  .clay-grid {\n    display: grid;\n    grid-template-columns: repeat(3, 1fr);\n    gap: 24px;\n  }\n\n  .clay-card {\n    background: white;\n    border: 1px solid var(--border);\n    border-radius: var(--radius);\n    padding: 32px;\n    text-align: center;\n  }\n\n  .clay-color {\n    width: 60px;\n    height: 60px;\n    border-radius: 50%;\n    margin: 0 auto 16px;\n    border: 2px solid var(--border);\n  }\n\n  .clay-name {\n    font-family: var(--serif);\n    font-size: 1.15rem;\n    color: var(--earth);\n    margin-bottom: 8px;\n  }\n\n  .clay-texture {\n    font-size: 0.85rem;\n    color: var(--text-soft);\n    margin-bottom: 0;\n  }\n\n  .clay-firing {\n    font-size: 0.8rem;\n    color: var(--gold);\n    margin-top: 12px;\n    margin-bottom: 8px;\n  }\n\n  .clay-best {\n    font-size: 0.83rem;\n    color: var(--text-soft);\n    margin-bottom: 12px;\n  }\n\n  .clay-personality {\n    font-size: 0.85rem;\n    color: var(--text-soft);\n    line-height: 1.7;\n    margin-top: 8px;\n  }\n\n  /* ─── GLAZE SECTION ─── */\n  .glaze-section {\n    background: var(--warm-white);\n  }\n\n  .glaze-grid {\n    display: grid;\n    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));\n    gap: 28px;\n  }\n\n  .glaze-card {\n    background: white;\n    border: 1px solid var(--border);\n    padding: 32px;\n    text-align: center;\n    border-radius: var(--radius);\n  }\n\n  .glaze-color {\n    width: 80px;\n    height: 80px;\n    border-radius: 50%;\n    margin: 0 auto 20px;\n    border: 2px solid var(--border);\n  }\n\n  .glaze-name {\n    font-family: var(--serif);\n    font-size: 1.15rem;\n    color: var לחקות — כמו נייר עבודת יד.</p>\n      </div>\n\n    </div>\n  </div>\n</section>\n\n<!-- ─── SECTION 3: GLAZES ─── -->\n<section class=\"glaze-section\">\n  <div class=\"section\">\n    <div class=\"section-header\">\n      <h2 class=\"section-title\">הזיגוגים — הנשמה של הכלי</h2>\n      <p class=\"section-desc\">זיגוג נראה כמו נוזל כשמורחים אותו. מה שיוצא מהכבשן אחרי 10 שעות — תמיד מפתיע.</p>\n    </div>\n    <div class=\"glaze-grid\">\n\n      <!-- לבן שמנת -->\n      <div class=\"glaze-card\">\n        <div class=\"glaze-color\" style=\"background: #F5F0E8;\"></div>\n        <div class=\"glaze-name\">לבן שמנת</div>\n        <div class=\"glaze-mood\">רך, חמים, מתחבר לכל שולחן</div>\n        <p class=\"glaze-desc\">גימור חלבי-חמים שמזכיר פשתן ישן. לא לבן קליני — לבן עם נשמה.</p>\n      </div>\n\n      <!-- ירוק מרווה -->\n      <div class=\"glaze-card\">\n        <div class=\"glaze-color\" style=\"background: #7A9E7E;\"></div>\n        <div class=\"glaze-name\">ירוק מרווה</div>\n        <div class=\"glaze-mood\">שקט, טבעי, כמו גינה אחרי גשם</div>\n        <p class=\"glaze-desc\">ירוק עמום שלא צועק — מבליח בין חום לירוק ומשתנה עם האור.</p>\n      </div>\n\n      <!-- אפור בזלת -->\n      <div class=\"glaze-card\">\n        <div class=\"glaze-color\" style=\"background: #4A4A4A;\"></div>\n        <div class=\"glaze-name\">אפור בזלת</div>\n        <div class=\"glaze-mood\">עוצמתי, מודרני, בלי פשרות</div>\n        <p class=\"glaze-desc\">אפור עמוק כמו סלע געשי. מוסיף עוגן וכובד לכלים שצריכים נוכחות.</p>\n      </div>\n\n      <!-- חרדל שדות -->\n      <div class=\"glaze-card\">\n        <div class=\"glaze-color\" style=\"background: #C9963A;\"></div>\n        <div class=\"glaze-name\">חרדל שדות</div>\n        <div class=\"glaze-mood\">שמשי, חם, מלא חיים</div>\n        <p class=\"glaze-desc\">צהוב-חרדלי שנולד מברזל בתוך הזיגוג. הוא מזכיר חיטה בשדה ברוח.</p>\n      </div>\n\n      <!-- שמיים בבוקר -->\n      <div class=\"glaze-card\">\n        <div class=\"glaze-color\" \n    clay2Firing: 'Firing: 1240°C',\n    clay2Best: 'Best for: abundance bowls, candlesticks, washing cups',\n    clay2Personality: 'Clay with presence. It brings an earthy warmth, and after firing retains a primal touch of earth.',\n    clay3Name: 'Chamotte Clay',\n    clay3Texture: 'Textured, authentic, rich grain',\n    clay3Firing: 'Firing: 1240°C',\n    clay3Best: 'Best for: decorative pieces, special serving dishes',\n    clay3Personality: 'Clay with character. The tiny grains create a texture that can\\'t be replicated — like handmade paper.',\n    glazeTitle: 'The Glazes — The Soul of the Piece',\n    glazeDesc: 'A glaze looks like liquid when applied. What comes out of the kiln after 10 hours — always a surprise.',\n    glaze1Name: 'Cream White',\n    glaze1Mood: 'Soft, warm, pairs with any table',\n    glaze1Desc: 'A warm milky finish reminiscent of old linen. Not clinical white — white with a soul.',\n    glaze2Name: 'Sage Green',\n    glaze2Mood: 'Quiet, natural, like a garden after rain',\n    glaze2Desc: 'A muted green that doesn\\'t shout — it shimmers between brown and green, changing with the light.',\n    glaze3Name: 'Basalt Grey',\n    glaze3Mood: 'Powerful, modern, uncompromising',\n    glaze3Desc: 'A deep grey like volcanic rock. Adds anchor and weight to pieces that need presence.',\n    glaze4Name: 'Field Mustard',\n    glaze4Mood: 'Sunny, warm, full of life',\n    glaze4Desc: 'A yellow-mustard born from iron within the glaze. It recalls wheat in a wind-swept field.',\n    glaze5Name: 'Morning Sky',\n    glaze5Mood: 'Tender, calm, like first light',\n    glaze5Desc: 'A soft blue-grey that looks different at every hour. Perfect for morning pieces.',\n    glaze6Name: 'Deep Terra Cotta',\n    glaze6Mood: 'Earthy, ancient, like an old jar',\n    glaze6Desc: 'A rich reddish-brown that looks as if the piece has always been there. Classic and timeless.',\n    kilnTitle: 'The Kiln — Where Everything Is Decided',\n    kilnP1: 'When the door closes, a 10-hour journey begins. The temperature rises slowly, degree by degree, until it reaches 1,240°C. At that point, the glaze begins to boil. It bubbles, melts, and fuses permanently with the clay — becoming a thin layer of glass inseparable from the piece itself.',\n    kilnP2: 'This is why the color will never fade. It\\'s not painted on the surface — it\\'s part of the molecular structure of the piece. You can wash it in a dishwasher, use it in an oven, use it daily for decades. The glaze will remain exactly as it came out of the kiln.',\n    kilnP3: 'And there\\'s something else: two identical pieces that enter the kiln never come out truly identical. The flow of heat, the position on the shelf, the precise moment the glaze began to flow — all create subtle, unrepeatable differences. That\\'s what makes each piece a true one-of-a-kind — not just a marketing word. It\\'s physics.',\n    safetyTitle: 'Complete Safety',\n    safety1: 'All glazes are food-safe',\n    safety2: 'Dishwasher safe at 60°C',\n    safety3: 'No lead, no cadmium, no heavy metals',\n    ctaTitle: 'Want to see these materials in action?',\n    ctaBtn: 'View the full collection →',\n    footerTagline: 'Handmade ceramics. Each piece is shaped by hand and prayer — bringing light and warmth into your home.',\n    footerNav: 'Navigate',\n    footerContact: 'Contact',\n    footerCopyright: '© 2025 Naomi Goldman | Handmade Ceramics',\n    footerLocation: 'Gvaot, Israel',\n  }\n};\n\nlet currentLang = 'he';\n\nfunction toggleLanguage() {\n  currentLang = currentLang === 'he' ? 'en' : 'he';\n  applyLanguage(currentLang);\n  localStorage.setItem('naomi-lang', currentLang);\n}\n\nfunction applyLanguage(lang) {\n  const t = TRANSLATIONS[lang];\n  const html = document.documentElement;\n  html.setAttribute('dir', t.dir);\n  html.setAttribute('lang', t.lang);\n  document.title = t.pageTitle;\n\n  const btn = document.getElementById('lang-toggle');\n  if (btn) {\n    btn.textContent = t.langBtn;\n    btn.classList.toggle('active-en', lang === 'en');\n    btn.title = lang === 'he' ? 'Switch to English' : 'עבור לעברית';\n  }\n\n  const annMsg1 = document.getElementById('ann-msg-1');\n  const annMsg2 = document.getElementById('ann-msg-2');\n  if (annMsg1) annMsg1.textContent = t.announcement1;\n  if (annMsg2) annMsg2.textContent = t.announcement2;\n\n  // Nav\n  const navLinks = document.querySelectorAll('nav a:not(.nav-wa)');\n  ['navProducts', 'navStory', 'navFaq', 'navMaterials'].forEach((k, i) => { if (navLinks[i]) navLinks[i].textContent = t[k]; });\n  const navWa = document.querySelector('.nav-wa');\n  if (navWa) navWa.childNodes[navWa.childNodes.length - 1].textContent = ' ' + t.navWa;\n\n  const mobileLinks = document.querySelectorAll('#mobile-nav a:not(.mobile-nav-wa)');\n  ['navProducts', 'navStory', 'navFaq', 'navMaterials'].forEach((k, i) => { if (mobileLinks[i]) mobileLinks[i].textContent = t[k]; });\n  const mobileWa = document.querySelector('.mobile-nav-wa');\n  if (mobileWa) mobileWa.textContent = t.navWa;\n\n  // Hero\n  const heroLabel = document.querySelector('.page-hero-label');\n  const heroTitle = document.querySelector('.page-hero-title');\n  const heroSub = document.querySelector('.page-hero-subtitle');\n  if (heroLabel) heroLabel.textContent = t.heroLabel;\n  if (heroTitle) heroTitle.textContent = t.heroTitle;\n  if (heroSub) heroSub.textContent = t.heroSubtitle;\n\n  // Clay section\n  const claySecTitle = document.querySelector('.clay-section .section-title');\n  const claySecDesc = document.querySelector('.clay-section .section-desc');\n  if (claySecTitle) claySecTitle.textContent = t.clayTitle;\n  if (claySecDesc) claySecDesc.textContent = t.clayDesc;\n\n  const clayCards = document.querySelectorAll('.clay-card');\n  for (let i = 0; i < clayCards.length; i++) {\n    const n = i + 1;\n    const card = clayCards[i];\n    const name = card.querySelector('.clay-name');\n    const texture = card.querySelector('.clay-texture');\n    const firing = card.querySelector('.clay-firing');\n    const best = card.querySelector('.clay-best');\n    const personality = card.querySelector('.clay-personality');\n    if (name) name.textContent = t['clay' + n + 'Name'];\n    if (texture) texture.textContent = t['clay' + n + 'Texture'];\n    if (firing) firing.textContent = t['clay' + n + 'Firing'];\n    if (best) best.textContent = t['clay' + n + 'Best'];\n    if (personality) personality.textContent = t['clay' + n + 'Personality'];\n  }\n\n  // Glaze section\n  const glazeSecTitle = document.querySelector('.glaze-section .section-title');\n  const glazeSecDesc = document.querySelector('.glaze-section .section-desc');\n  if (glazeSecTitle) glazeSecTitle.textContent = t.glazeTitle;\n  if (glazeSecDesc) glazeSecDesc.textContent = t.glazeDesc;\n\n  const glazeCards = document.querySelectorAll('.glaze-card');\n  for (let i = 0; i < glazeCards.length; i++) {\n    const n = i + 1;\n    const card = glazeCards[i];\n    const name = card.querySelector('.glaze-name');\n    const mood = card.querySelector('.glaze-mood');\n    const desc = card.querySelector('.glaze-desc');\n    if (name) name.textContent = t['glaze' + n + 'Name'];\n    if (mood) mood.textContent = t['glaze' + n + 'Mood'];\n    if (desc) desc.textContent = t['glaze' + n + 'Desc'];\n  }\n\n  // Kiln section\n  const kilnTitle = document.querySelector('.kiln-title');\n  const kilnTexts = document.querySelectorAll('.kiln-text');\n  if (kilnTitle) kilnTitle.textContent = t.kilnTitle;\n  if (kilnTexts[0]) kilnTexts[0].textContent = t.kilnP1;\n  if (kilnTexts[1]) kilnTexts[1].textContent = t.kilnP2;\n  if (kilnTexts[2]) kilnTexts[2].textContent = t.kilnP3;\n\n  // Safety section\n  const safetyTitle = document.querySelector('.safety-title');\n  if (safetyTitle) safetyTitle.textContent = t.safetyTitle;\n  const safetyItems = document.querySelectorAll('.safety-item');\n  const safetyKeys = ['safety1', 'safety2', 'safety3'];\n  safetyItems.forEach((item, i) => {\n    const span = item.querySelectorAll('span');\n    if (span[1] && safetyKeys[i]) span[1].textContent = t[safetyKeys[i]];\n  });\n\n  // CTA\n  const ctaTitle = document.querySelector('.cta-title');\n  const ctaBtn = document.querySelector('.cta-btn');\n  if (ctaTitle) ctaTitle.textContent = t.ctaTitle;\n  if (ctaBtn) ctaBtn.textContent = t.ctaBtn;\n\n  // Footer\n  const footTagline = document.querySelector('.footer-brand-text');\n  const footCopy = document.querySelector('.footer-bottom span:first-child');\n  const footLoc = document.querySelector('.footer-bottom span:last-child');\n  const footColTitles = document.querySelectorAll('.footer-col-title');\n  if (footTagline) footTagline.textContent = t.footerTagline;\n  if (footCopy) footCopy.textContent = t.footerCopyright;\n  if (footLoc) footLoc.textContent = t.footerLocation;\n  if (footColTitles[0]) footColTitles[0].textContent = t.footerNav;\n  if (footColTitles[1]) footColTitles[1].textContent = t.footerContact;\n\n  const footLinks = document.querySelectorAll('.footer-links');\n  if (footLinks[0]) {\n    const links = footLinks[0].querySelectorAll('a');\n    const navTexts = [t.navProducts, t.navStory, t.navFaq, t.navMaterials];\n    links.forEach((a, i) => { if (navTexts[i]) a.textContent = navTexts[i]; });\n  }\n}\n\n// ─── INIT ───\n(function() {\n  const saved = localStorage.getItem('naomi-lang');\n  if (saved && saved !== 'he') {\n    currentLang = saved;\n    applyLanguage(currentLang);\n  }\n\n  const hamburger = document.getElementById('hamburger-btn');\n  const mobileNav = document.getElementById('mobile-nav');\n  hamburger.addEventListener('click', () => {\n    hamburger.classList.toggle('open');\n    mobileNav.classList.toggle('open');\n  });\n  document.querySelectorAll('#mobile-nav a').forEach(a => {\n    a.addEventListener('click', () => {\n      hamburger.classList.remove('open');\n      mobileNav.classList.remove('open');\n    });\n  });\n})();\n\n// ── ANNOUNCEMENT BAR ROTATION ──\n(function() {\n  const msg1 = document.getElementById('ann-msg-1');\n  const msg2 = document.getElementById('ann-msg-2');\n  if (!msg1 || !msg2) return;\n  let showing = 1;\n  setInterval(() => {\n    if (showing === 1) {\n      msg1.classList.remove('active');\n      msg2.classList.add('active');\n      showing = 2;\n    } else {\n      msg2.classList.remove('active');\n      msg1.classList.add('active');\n      showing = 1;\n    }\n  }, 4000);\n})();\n<\/script>\n\n</body>\n</html>"};
const PAGE_TITLES = {
  home: 'נעמי גולדמן | כלי קרמיקה בעבודת יד',
  about: 'הסיפור שלי | נעמי גולדמן',
  faq: 'שאלות ותשובות | נעמי גולדמן',
  materials: 'החומרים שלי | נעמי גולדמן'
};
const frame = document.getElementById('site-frame');
let currentPage = 'home';

function pageFromUrl(url) {
  if (!url) return null;
  const lower = String(url).toLowerCase();
  if (lower.includes('about.html')) return 'about';
  if (lower.includes('faq.html')) return 'faq';
  if (lower.includes('materials.html')) return 'materials';
  if (lower.includes('index.html') || lower === '#' || lower.endsWith('/')) return 'home';
  return null;
}

function extractHash(url) {
  const hashIndex = String(url || '').indexOf('#');
  return hashIndex >= 0 ? String(url).slice(hashIndex) : '';
}

function rewriteForSingleFile(source) {
  return source
    .replace(/href="index.html#([^"]*)"/g, 'href="#home-$1" data-single-page="home" data-single-hash="#$1"')
    .replace(/href="index.html"/g, 'href="#home" data-single-page="home"')
    .replace(/href="about.html"/g, 'href="#about" data-single-page="about"')
    .replace(/href="faq.html"/g, 'href="#faq" data-single-page="faq"')
    .replace(/href="materials.html"/g, 'href="#materials" data-single-page="materials"');
}

function syncHash(page, hash = '') {
  const next = page === 'home' && hash ? hash : '#' + page;
  if (location.hash !== next) history.replaceState(null, '', next);
}

function loadPage(page = 'home', scrollHash = '') {
  currentPage = page;
  document.title = PAGE_TITLES[page] || PAGE_TITLES.home;
  frame.srcdoc = rewriteForSingleFile(PAGES[page] || PAGES.home);
  frame.onload = () => {
    const doc = frame.contentDocument;
    if (!doc) return;

    doc.addEventListener('click', (event) => {
      const anchor = event.target.closest('a');
      if (!anchor) return;

      const targetPage = anchor.dataset.singlePage || pageFromUrl(anchor.getAttribute('href'));
      if (!targetPage) return;

      event.preventDefault();
      loadPage(targetPage, anchor.dataset.singleHash || extractHash(anchor.getAttribute('href')));
    }, true);

    if (scrollHash) {
      const id = scrollHash.replace(/^#/, '');
      const target = doc.getElementById(id);
      if (target) setTimeout(() => target.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
    }

    syncHash(page, scrollHash);
  };
}

window.addEventListener('hashchange', () => {
  const hash = location.hash.replace(/^#/, '');
  const [pagePart, anchorPart] = hash.split('-', 2);
  const page = ['home', 'about', 'faq', 'materials'].includes(pagePart) ? pagePart : 'home';
  const scrollHash = page === 'home' && anchorPart ? '#' + anchorPart : '';
  if (page !== currentPage || scrollHash) loadPage(page, scrollHash);
});

const initialHash = location.hash.replace(/^#/, '');
const [initialPagePart, initialAnchorPart] = initialHash.split('-', 2);
const initialPage = ['home', 'about', 'faq', 'materials'].includes(initialPagePart) ? initialPagePart : 'home';
loadPage(initialPage, initialPage === 'home' && initialAnchorPart ? '#' + initialAnchorPart : '');
